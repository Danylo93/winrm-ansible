name: OBT Release CI/CD
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'obt/**'
      - '.github/workflows/ansible-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'obt/**'
      - '.github/workflows/ansible-ci.yml'

jobs:
  lint-and-validate:
    name: 🔍 Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible + linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core yamllint
          ansible-galaxy collection install ansible.windows community.windows

      - name: 🔍 Lint YAML files
        run: |
          cd obt
          yamllint -c .yamllint.yml ansible/ || echo "⚠️ YAML lint warnings found but continuing..."

      - name: 🔍 Basic Ansible validation
        run: |
          cd obt
          echo "✅ Ansible collections installed successfully"
          ansible-galaxy collection list | grep -E "(ansible.windows|community.windows)" || echo "⚠️ Collections may not be fully installed"

      - name: ✅ Validate playbook syntax
        run: |
          cd obt/ansible
          export ANSIBLE_ROLES_PATH="$(pwd)/roles"
          export ANSIBLE_HOST_KEY_CHECKING="False"
          ansible-playbook -i inventories/dev/hosts.yml playbooks/obt_release.yml --syntax-check

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Ansible security scan
        run: |
          cd obt
          # Verificar se há senhas hardcoded
          if grep -r "password.*:" ansible/ --exclude-dir=.git; then
            echo "❌ Senhas hardcoded encontradas!"
            exit 1
          fi
          echo "✅ Nenhuma senha hardcoded encontrada"

      - name: 🔍 Check for sensitive files
        run: |
          cd obt
          # Verificar se há arquivos de vault não criptografados
          find ansible/ -name "vault.yml" -not -path "*/vault.yml.template" | while read file; do
            if ! ansible-vault view "$file" >/dev/null 2>&1; then
              echo "❌ Arquivo vault não criptografado: $file"
              exit 1
            fi
          done
          echo "✅ Verificação de segurança concluída"

  test-structure:
    name: 🧪 Test Project Structure
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate project structure
        run: |
          cd obt

          # Verificar estrutura de diretórios
          required_dirs=(
            "ansible/inventories/dev"
            "ansible/inventories/prd"
            "ansible/playbooks"
            "ansible/roles/obt_release"
            "scripts"
            "docs"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Diretório obrigatório não encontrado: $dir"
              exit 1
            fi
          done

          # Verificar arquivos obrigatórios
          required_files=(
            "ansible/inventories/dev/hosts.yml"
            "ansible/playbooks/obt_release.yml"
            "ansible/roles/obt_release/tasks/main.yml"
            "scripts/test-vm.sh"
            "scripts/release-prd.sh"
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Arquivo obrigatório não encontrado: $file"
              exit 1
            fi
          done

          echo "✅ Estrutura do projeto validada com sucesso"

  documentation-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📖 Check documentation
        run: |
          cd obt

          # Verificar se README existe e não está vazio
          if [ ! -s "README.md" ]; then
            echo "❌ README.md está vazio ou não existe"
            exit 1
          fi

          # Verificar se documentação de fluxo existe
          if [ ! -s "docs/FLUXO-RELEASE.md" ]; then
            echo "❌ Documentação de fluxo não encontrada"
            exit 1
          fi

          echo "✅ Documentação validada"

  role-validation:
    name: 🎭 Role Validation
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install ansible.windows community.windows

      - name: 🎭 Validate OBT role
        run: |
          cd obt/ansible
          export ANSIBLE_ROLES_PATH="$(pwd)/roles"
          export ANSIBLE_HOST_KEY_CHECKING="False"

          # Verificar se role tem estrutura correta
          role_dirs=("tasks" "defaults" "meta" "handlers")
          for dir in "${role_dirs[@]}"; do
            if [ ! -d "roles/obt_release/$dir" ]; then
              echo "❌ Diretório da role não encontrado: roles/obt_release/$dir"
              exit 1
            fi
          done

          # Verificar se main.yml existe em tasks
          if [ ! -f "roles/obt_release/tasks/main.yml" ]; then
            echo "❌ tasks/main.yml não encontrado na role"
            exit 1
          fi

          echo "✅ Role OBT validada com sucesso"

  scripts-validation:
    name: 🔧 Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Validate shell scripts
        run: |
          cd obt

          # Verificar se scripts têm permissão de execução
          scripts=("scripts/test-vm.sh" "scripts/release-prd.sh" "scripts/deploy.sh" "run-obt.sh")

          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              # Verificar sintaxe bash
              bash -n "$script" || {
                echo "❌ Erro de sintaxe em: $script"
                exit 1
              }
              echo "✅ Script validado: $script"
            else
              echo "⚠️ Script não encontrado: $script"
            fi
          done

  inventory-validation:
    name: 📋 Inventory Validation
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: 📋 Validate inventories
        run: |
          cd obt/ansible

          # Verificar inventários
          inventories=("inventories/dev/hosts.yml" "inventories/prd/hosts.yml")

          for inventory in "${inventories[@]}"; do
            if [ -f "$inventory" ]; then
              # Verificar se inventory é válido
              ansible-inventory -i "$inventory" --list >/dev/null || {
                echo "❌ Inventory inválido: $inventory"
                exit 1
              }
              echo "✅ Inventory validado: $inventory"
            else
              echo "❌ Inventory não encontrado: $inventory"
              exit 1
            fi
          done

  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-scan, test-structure, documentation-check, role-validation, scripts-validation, inventory-validation]
    if: always()
    steps:
      - name: 📊 Generate build summary
        run: |
          echo "## 🎉 OBT Release CI/CD Summary"
          echo ""
          echo "### ✅ Jobs Completed:"
          echo "- 🔍 Lint and Validate"
          echo "- 🛡️ Security Scan"
          echo "- 🧪 Test Project Structure"
          echo "- 📚 Documentation Check"
          echo "- 🎭 Role Validation"
          echo "- 🔧 Scripts Validation"
          echo "- 📋 Inventory Validation"
          echo ""
          echo "### 🚀 Next Steps:"
          echo "- Deploy to staging environment"
          echo "- Run integration tests"
          echo "- Deploy to production"
          echo ""
          echo "**Build completed at:** $(date)"
