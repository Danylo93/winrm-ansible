# ==========================================
# 📋 METADADOS DA ROLE OBT_RELEASE
# ==========================================
# Informações sobre a role de release do OBT
# ==========================================

galaxy_info:
  role_name: obt_release
  author: DevOps Team
  description: Role para automação de release do OBT com limpeza de pastas
  company: Argo
  license: MIT
  min_ansible_version: 2.9
  
  platforms:
    - name: Windows
      versions:
        - 2016
        - 2019
        - 2022
  
  galaxy_tags:
    - windows
    - iis
    - deployment
    - release
    - automation
    - obt
    - argoweb
    - tmsweb

dependencies:
  - role: windows_baseline
    when: ensure_baseline | default(false)

collections:
  - ansible.windows
  - community.windows
