# ==========================================
# 📅 TASKS DE DATA/HORA
# ==========================================
# Obtenção e formatação de timestamps
# ==========================================

---
- name: "📅 Obter data e hora atual"
  ansible.windows.win_shell: Get-Date -Format "yyyy-MM-dd HH:mm:ss"
  register: current_datetime_result

- name: "📅 Obter timestamp para backup"
  ansible.windows.win_shell: |
    $timestamp = [int][double]::Parse((Get-Date -UFormat %s))
    Write-Output $timestamp
  register: timestamp_result

- name: "📅 Obter data simples"
  ansible.windows.win_shell: Get-Date -Format "yyyy-MM-dd"
  register: simple_date_result

- name: "📅 Definir variáveis de data/hora"
  set_fact:
    current_datetime: "{{ current_datetime_result.stdout.strip() if current_datetime_result.stdout is defined else ansible_date_time.iso8601 | default('2024-01-01T12:00:00') }}"
    timestamp_release: "{{ timestamp_result.stdout.strip() if timestamp_result.stdout is defined else ansible_date_time.epoch | default('1704110400') }}"
    data_release: "{{ simple_date_result.stdout.strip() if simple_date_result.stdout is defined else ansible_date_time.date | default('2024-01-01') }}"
    backup_path: "{{ obt_backup_root }}\\{{ simple_date_result.stdout.strip() if simple_date_result.stdout is defined else ansible_date_time.date | default('2024-01-01') }}_{{ timestamp_result.stdout.strip() if timestamp_result.stdout is defined else ansible_date_time.epoch | default('1704110400') }}"

- name: "📅 Exibir informações de tempo"
  debug:
    msg: |
      📅 Data/Hora atual: {{ current_datetime }}
      🕐 Timestamp: {{ timestamp_release }}
      📁 Caminho do backup: {{ backup_path }}
