      Write-Output "=" * 60
  loop: "{{ active_cleanup_clients.tmsweb }}"
  register: tmsweb_cleanup_results
  ignore_errors: true

- name: "📊 Resumo geral da limpeza"
  debug:
    msg: |
      ==========================================
      📊 RESUMO GERAL DA LIMPEZA
      ==========================================
      {% if test_mode | default(false) %}
      🧪 TESTE: Limpeza limitada executada
      ✅ ArgoWeb: {{ active_cleanup_clients.argoweb | length }} pastas (teste)
      ✅ TmsWeb: {{ active_cleanup_clients.tmsweb | length }} pastas (teste)
      {% else %}
      🚀 PRODUÇÃO: Limpeza completa executada
      ✅ ArgoWeb: {{ active_cleanup_clients.argoweb | length }} pastas processadas
      ✅ TmsWeb: {{ active_cleanup_clients.tmsweb | length }} pastas processadas
      {% endif %}
      🧹 Limpeza concluída com sucesso!
      ==========================================
