# Configurações de validação
validation_enabled: true
validation_timeout: 30
validation_checks:
  - apppool_status
  - essential_files
  - disk_space

# Configurações de Azure DevOps
azure_devops:
  enabled: false
  org: ""
  project: ""
  pipeline_id: ""
  pat: ""

# Configurações de logging
logging:
  enabled: true
  level: "INFO"
  path: "../logs"
  retention_days: 30

# Configurações de rollback
rollback:
  enabled: true
  automatic: false
  timeout: 600
