# ==========================================
# 🔧 VARIÁVEIS PADRÃO - OBT RELEASE
# ==========================================
# Valores padrão para a role de release do OBT
# Podem ser sobrescritos por inventário ou playbook
# ==========================================

# Configurações do OBT
obt_app_pool: "OBTAppPool"
obt_site_name: "OBT"
obt_release_path: "C:\\inetpub\\wwwroot\\OBT"
obt_backup_root: "C:\\releases\\backup"
obt_source_path: "\\\\buildserver\\releases\\obt\\latest"

# Configurações de backup
backup_enabled: true
backup_retention_days: 7
backup_compress: false

# Configurações de limpeza
cleanup_enabled: true
cleanup_timeout: 300
cleanup_preserve_files:
  - "images"
  - "Web.config"
  - "ApplicationInsights.config"
  - "librdkafka"
  - "logs"
  - "temp"

# Caminhos base para limpeza
argoweb_base_path: "E:\\Aplicacoes\\useargo\\argoweb"
tmsweb_base_path: "E:\\Aplicacoes\\useargo\\tmsweb"

