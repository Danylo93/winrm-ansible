# ==========================================
# 🚀 INVENTÁRIO - AMBIENTE PRODUÇÃO
# ==========================================
# Configuração REAL de produção onde acontece a release
# ATENÇÃO: Este é o ambiente REAL de produção!
# ==========================================

all:
  children:
    windows:
      children:
        obt_production_servers:
          hosts:
            obt-prd-server:
              # CONFIGURAR COM DADOS REAIS DE PRODUÇÃO
              ansible_host: "{{ vault_prd_host }}"
              ansible_user: "{{ vault_prd_user }}"
              ansible_password: "{{ vault_prd_password }}"
              ansible_connection: winrm
              ansible_port: 5986  # HTTPS em produção
              ansible_winrm_transport: ntlm
              ansible_winrm_scheme: https
              ansible_winrm_server_cert_validation: ignore
              ansible_winrm_operation_timeout_sec: 120
              ansible_winrm_read_timeout_sec: 180

              # Configurações REAIS do OBT em PRODUÇÃO
              obt_app_pool: "OBTAppPool"
              obt_site_name: "OBT"
              obt_release_path: "C:\\inetpub\\wwwroot\\OBT"
              obt_backup_root: "C:\\releases\\backup\\prd"
              obt_source_path: "\\\\buildserver\\releases\\obt\\latest"

              # Configurações REAIS ArgoWeb/TmsWeb em PRODUÇÃO
              argoweb_base_path: "E:\\Aplicacoes\\useargo\\argoweb"
              tmsweb_base_path: "E:\\Aplicacoes\\useargo\\tmsweb"

  vars:
    # Variáveis globais do ambiente PRODUÇÃO
    environment: "prd"
    deploy_user: "deploy_prd"
    backup_retention_days: 30  # Maior retenção em produção

    # Configurações de limpeza COMPLETA em produção
    cleanup_enabled: true
    cleanup_preserve_files:
      - "images"
      - "Web.config"
      - "ApplicationInsights.config"
      - "librdkafka"
      - "logs"
      - "temp"
      - "backup"

    # Azure DevOps habilitado para produção
    azure_devops:
      enabled: true
      org: "{{ vault_azure_org }}"
      project: "{{ vault_azure_project }}"
      pipeline_id: "{{ vault_azure_pipeline_id }}"
      pat: "{{ vault_azure_pat }}"

    # Configurações de segurança para PRODUÇÃO
    security:
      require_approval: true
      max_parallel_deployments: 1
      rollback_enabled: true

    # Validações rigorosas em produção
    validation_strict: true

    # Lista COMPLETA de clientes para produção
    # (usar a lista completa definida na role)