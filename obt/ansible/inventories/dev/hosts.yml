# ==========================================
# 🧪 INVENTÁRIO - VM DE TESTES (DEV)
# ==========================================
# VM para validar automação antes da release em PRD
# Simula o ambiente de produção para testes
# ==========================================

all:
  children:
    dev:
      hosts:
        vm-obt-test:
              ansible_host: 10.60.7.11
              ansible_user: danylo.oliveira@az.local
              ansible_password: "{{ vault_dev_password | default('Argo@21082025') }}"
              ansible_connection: winrm
              ansible_port: 5985
              ansible_winrm_transport: ntlm
              ansible_winrm_scheme: http
              ansible_winrm_operation_timeout_sec: 60
              ansible_winrm_read_timeout_sec: 120

              # Configurações de TESTE do OBT
              obt_app_pool: "OBTAppPool"
              obt_site_name: "OBT_TEST"
              obt_release_path: "C:\\inetpub\\wwwroot\\OBT"
              obt_backup_root: "C:\\releases\\backup\\test"
              obt_source_path: "\\\\buildserver\\releases\\obt\\test"

              # Configurações de TESTE ArgoWeb/TmsWeb
              argoweb_base_path: "E:\\Aplicacoes\\useargo\\argoweb"
              tmsweb_base_path: "E:\\Aplicacoes\\useargo\\tmsweb"

  vars:
    # Variáveis globais da VM de TESTE
    environment: "test"
    deploy_user: "test_user"
    backup_retention_days: 3  # Menor retenção para testes

    # Configurações de limpeza para TESTES
    cleanup_enabled: true
    cleanup_preserve_files:
      - "images"
      - "Web.config"
      - "ApplicationInsights.config"
      - "librdkafka"
      - "logs"
      - "temp"

    # Azure DevOps desabilitado para testes
    azure_devops:
      enabled: false

    # Configurações específicas de TESTE
    test_mode: true
    validation_strict: false  # Validações mais flexíveis em teste

    # Simulação de release para validar processo
    simulate_production: true

    # Lista reduzida de clientes para teste (apenas alguns)
    test_cleanup_clients:
      argoweb:
        - { nome: "nx_argo01", pasta: "nx_argo01" }
        - { nome: "nx_argo02", pasta: "nx_argo02" }
      tmsweb:
        - { nome: "tms_argo01", pasta: "tms_argo01" }
        - { nome: "tms_argo02", pasta: "tms_argo02" }

